[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-personal"
dynamic = ["version"]
description = "UW application that supports student contact information"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "UWIT Student & Educational Technology Services", email = "aca-it@uw.edu"}
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "django~=5.2",
    "django-userservice~=3.2",
    "django-persistent-message~=1.3",
    "django-supporttools~=3.6",
    "uw-django-saml2~=1.8",
    "uw-memcached-clients~=1.0",
    "uw-restclients-core~=1.4",
    "uw-restclients-pws~=2.1",
    "uw-restclients-sps-contacts~=1.0",
    "uw-restclients-django-utils~=2.3",
    "psycopg[c]",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools]
packages = ["student_personal"]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "student_personal/VERSION"}

[tool.ruff]
line-length = 88
exclude = [
]

[tool.ruff.lint]
ignore = [
    "BLE001",  # allow broad Exception catches
    "RUF012",  # allow mutable class attributes
    "S110",    # allow try-except-pass for graceful degradation
]

[tool.coverage.run]
source = ["student_personal"]
parallel = true
omit = [
     "student_personal/tests/*"
]

[tool.coverage.paths]
source = [
    "student_personal/",
    "/app/student_personal/",
]
